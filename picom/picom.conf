#################################
#       Backend & General       #
#################################
backend = "glx";
vsync = true;
use-damage = true;
detect-client-opacity = true;
detect-rounded-corners = false;
dithered-present = true;

unredir-if-possible = true;
unredir-if-possible-delay = 500;

#################################
#         Animations            #
#################################
fading = true;
fade-in-step = 0.1;
fade-out-step = 0.1;
fade-delta = 10;

#################################
#            Shadows            #
#################################
shadow = true;
shadow-radius = 20;
shadow-offset-x = -15;
shadow-offset-y = -15;
shadow-opacity = 0.45;

#################################
#             Blur              #
#################################
blur-method = "dual_kawase";
blur-strength = 8;
blur-background = true;
blur-background-frame = true;
blur-background-fixed = true;

#################################
#        Rounded Corners        #
#################################
corner-radius = 0;

#################################
#           Rules               #
#################################
rules = (
  {
    match = "fullscreen = true";
    blur-background = false;
    blur-background-frame = false;
    fade = false;
    shadow = false;
    opacity = 1.0;
  },

  {
    match = "window_type = 'tooltip'";
    fade = false;
    shadow = false;
    opacity = 0.9;
  },

  {
    match = "window_type = 'dock' || window_type = 'desktop'";
    shadow = false;
    blur-background = false;
    blur-background-frame = false;
    opacity = 1.0;
  },

  {
    match = "focused = false";
    opacity = 0.85;
  },

  {
    match = "focused = true";
    opacity = 0.95;
  }
);

